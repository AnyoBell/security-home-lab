input {
  beats  { port => 5044 }
  syslog { port => 5514 }
}

filter {
  if [message] =~ /"(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH) / {
    grok {
      match => { "message" => '%{IPORHOST:client_ip} - %{DATA:auth_user} \[%{HTTPDATE:nginx_time}\] "%{WORD:http_method} %{DATA:http_path} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} %{NUMBER:bytes:int} "%{DATA:referrer}" "%{DATA:user_agent}"' }
      tag_on_failure => ["nginx_parse_fail"]
    }
  }
}

output {
  elasticsearch {
    hosts    => ["https://elasticsearch:9200"]
    cacert   => "/usr/share/logstash/config/certs/ca/ca.crt"
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index    => "homelab-logs-%{+YYYY.MM.dd}"
  }
}
